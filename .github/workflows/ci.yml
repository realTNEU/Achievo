name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.21', '1.22']
    # Note: Linter warning about TEST_MONGODB_URI is a false positive - 
    # accessing secrets via ${{ secrets.* }} is the correct GitHub Actions syntax
    env:
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      shell: bash
      run: |
        go test -v -race -coverprofile=coverage.out \
          ./internal/config/... \
          ./internal/detector/... \
          ./internal/discovery/... \
          ./internal/monitor/... \
          ./internal/rules/... \
          ./internal/storage/... \
          ./pkg/memory/...
      continue-on-error: true

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.21'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Verify project structure
      shell: bash
      continue-on-error: true
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing cmd directory:"
        ls -la cmd/ || true
        echo "Checking for cmd/achievo:"
        if [ -d "cmd/achievo" ]; then
          ls -la cmd/achievo/ || true
        else
          echo "Warning: cmd/achievo directory not found"
        fi
        echo "Checking for cmd/fetch-steam-schema:"
        if [ -d "cmd/fetch-steam-schema" ]; then
          ls -la cmd/fetch-steam-schema/ || true
        else
          echo "Warning: cmd/fetch-steam-schema directory not found"
        fi

    - name: Build
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          go build -o achievo.exe ./cmd/achievo
        else
          go build -o achievo ./cmd/achievo
        fi

    - name: Build Steam Schema CLI
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          go build -o fetch-steam-schema.exe ./cmd/fetch-steam-schema
        else
          go build -o fetch-steam-schema ./cmd/fetch-steam-schema
        fi

